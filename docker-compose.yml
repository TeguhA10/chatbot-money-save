services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-chatbot_finance}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123!}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OCTANE_SERVER: frankenphp
      GATEWAY_OUTBOUND_URL: http://gateway:3001/send
    ports: ["${BACKEND_PORT:-8001}:8000"]
    volumes: ["backend_storage:/var/www/storage"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: ./backend/.env
    command: php artisan queue:work --tries=3 --timeout=60
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-chatbot_finance}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123!}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_OUTBOUND_URL: http://gateway:3001/send
    volumes: ["backend_storage:/var/www/storage"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    build: ./whatsapp-gateway
    env_file: ./whatsapp-gateway/.env
    environment:
      LARAVEL_WEBHOOK_URL: http://backend:8000/api/webhook/whatsapp
      BAILEYS_AUTH_DIR: /data/auth_info_baileys
    volumes: ["baileys_auth:/data/auth_info_baileys"]
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-chatbot_finance}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123!}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-chatbot_finance}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5 }
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123!}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_DATABASE:-chatbot_finance}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 10
      AUTH_TYPE: md5
    ports: ["6432:6432"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: http backend:8000
    env_file:
      - ./backend/.env
    ports:
      - "4040:4040"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  backend_storage: {}
  baileys_auth: {}
  redis_data: {}
  postgres_data: {}
