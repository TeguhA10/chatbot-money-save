  #     postgres: { condition: service_healthy }
  #   restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: http backend:8000
    env_file:
      - ./backend/.env
    ports:
      - "4040:4040"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  backend_storage: {}
  baileys_auth: {}
  redis_data: {}
  postgres_data: {}
  whisper_cache: {}
