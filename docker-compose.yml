services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OCTANE_SERVER: frankenphp
      GATEWAY_OUTBOUND_URL: http://gateway:3001/send
      VOICE_SERVICE_URL: http://voice-service:9000/transcribe
    ports: ["${BACKEND_PORT:-8001}:8000"]
    volumes:
      - backend_storage:/var/www/storage
      - ./backend/app:/var/www/app
      - ./backend/routes:/var/www/routes
      - ./backend/config:/var/www/config
      - ./backend/resources:/var/www/resources
      - ./backend/database:/var/www/database
      - ./backend/public:/var/www/public
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: ./backend/.env
    command: php artisan queue:work --tries=3 --timeout=60
    environment:
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_OUTBOUND_URL: http://gateway:3001/send
      VOICE_SERVICE_URL: http://voice-service:9000/transcribe
    volumes:
      - backend_storage:/var/www/storage
      - ./backend/app:/var/www/app
      - ./backend/routes:/var/www/routes
      - ./backend/config:/var/www/config
      - ./backend/resources:/var/www/resources
      - ./backend/database:/var/www/database
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    build: ./whatsapp-gateway
    env_file: ./whatsapp-gateway/.env
    environment:
      LARAVEL_WEBHOOK_URL: http://backend:8000/api/webhook/whatsapp
      BAILEYS_AUTH_DIR: /data/auth_info_baileys
      VOICE_SERVICE_URL: http://voice-service:9000/transcribe
    volumes: ["baileys_auth:/data/auth_info_baileys"]
    depends_on:
      backend: { condition: service_started }
      voice-service: { condition: service_started }
    restart: unless-stopped

  voice-service:
    build: ./voice-service
    restart: unless-stopped
    environment:
      WHISPER_MODEL: tiny
      WHISPER_LANGUAGE: id
    volumes:
      - whisper_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9000/health\")' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: ${DB_DATABASE:-chatbot_finance}
  #     POSTGRES_USER: ${DB_USERNAME:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-password123!}
  #   ports: ["5432:5432"]
  #   volumes: ["postgres_data:/var/lib/postgresql/data"]
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-chatbot_finance}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5 }
    restart: unless-stopped

  # pgbouncer:
  #   image: edoburu/pgbouncer:latest
  #   environment:
  #     DB_USER: ${DB_USERNAME:-postgres}
  #     DB_PASSWORD: ${DB_PASSWORD:-password123!}
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_NAME: ${DB_DATABASE:-chatbot_finance}
