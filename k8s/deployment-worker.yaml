apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-core-worker
  namespace: chatbot-finance
  labels:
    app.kubernetes.io/name: chatbot-core-worker
    app.kubernetes.io/component: background-worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: chatbot-core-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatbot-core-worker
    spec:
      containers:
        - name: queue-worker
          image: your-registry.com/chatbot-finance-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=60", "--sleep=1"]
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "192Mi"
            limits:
              cpu: "800m"
              memory: "384Mi"
